<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163B31"/>
      <stop offset="55%" stop-color="#0F2C25"/>
      <stop offset="100%" stop-color="#0A211B"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C878"/>
      <stop offset="100%" stop-color="#CBA135"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- vault dial ring with tick marks -->
  <g stroke="url(#brass)" stroke-width="10" fill="none">
    <circle cx="256" cy="256" r="168"/>
  </g>
  <g fill="url(#brass)">
    <!-- 12 tick marks around the dial -->
    <g id="ticks">
      <rect x="251" y="66" width="10" height="26" rx="3"/>
    </g>
    <use href="#ticks" transform="rotate(30 256 256)"/>
    <use href="#ticks" transform="rotate(60 256 256)"/>
    <use href="#ticks" transform="rotate(90 256 256)"/>
    <use href="#ticks" transform="rotate(120 256 256)"/>
    <use href="#ticks" transform="rotate(150 256 256)"/>
    <use href="#ticks" transform="rotate(180 256 256)"/>
    <use href="#ticks" transform="rotate(210 256 256)"/>
    <use href="#ticks" transform="rotate(240 256 256)"/>
    <use href="#ticks" transform="rotate(270 256 256)"/>
    <use href="#ticks" transform="rotate(300 256 256)"/>
    <use href="#ticks" transform="rotate(330 256 256)"/>
  </g>

  <!-- inner paper disc -->
  <circle cx="256" cy="256" r="132" fill="#F4EFE3"/>

  <!-- minimal QR glyph, ink colored, centered -->
  <g fill="#0F2C25">
    <!-- finder square, top-left -->
    <rect x="196" y="196" width="52" height="52" rx="6"/>
    <rect x="210" y="210" width="24" height="24" rx="3" fill="#F4EFE3"/>
    <rect x="217" y="217" width="10" height="10" fill="#0F2C25"/>

    <!-- finder square, bottom-right -->
    <rect x="264" y="264" width="52" height="52" rx="6"/>
    <rect x="278" y="278" width="24" height="24" rx="3" fill="#F4EFE3"/>
    <rect x="285" y="285" width="10" height="10" fill="#0F2C25"/>

    <!-- scattered data dots -->
    <rect x="264" y="196" width="18" height="18" rx="3"/>
    <rect x="298" y="196" width="18" height="18" rx="3"/>
    <rect x="196" y="264" width="18" height="18" rx="3"/>
    <rect x="196" y="298" width="18" height="18" rx="3"/>
    <rect x="298" y="298" width="18" height="18" rx="3"/>
  </g>
</svg>
